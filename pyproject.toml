[project]
name = "jmlc-utt-classifier"
version = "0.1.0"
description = "Классификация городских участков (UTT) по уличным панорамам"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["venv", ".venv", "data", "runs", "checkpoints"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
extend-exclude = "venv|data|runs|checkpoints"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
